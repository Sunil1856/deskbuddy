[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
upload_port = COM6

board_build.partitions = huge_app.csv
build_src_filter = +<*> -<ram_test.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.3.0

[env:ram_test]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
upload_port = COM6

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

build_src_filter = -<*> +<ram_test.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

